agent_id: "{your-agent-id}"
version: "0.1.0"
description: "{Agent 一句话说明}"

model:
  provider: "openai"
  name: "gpt-4o"
  temperature: 0.2
  max_tokens: 4096

runtime:
  max_iterations: 10
  timeout_seconds: 300
  retry_policy:
    max_retries: 3
    backoff: "exponential"
    initial_delay_seconds: 2

memory:
  type: "session"
  max_context_turns: 20

tools:
  - ref: "skills/{skill-name}.yaml"
    required: true

observability:
  log_level: "INFO"
  trace_enabled: true

safety:
  instruction_refs:
    - "instructions/safety/data-privacy.md"
  auto_escalation:
    - trigger: "{trigger-condition}"
      action: "pause_and_notify_human"
