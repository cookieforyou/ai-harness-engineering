scenario_id: "{your-scenario-id}"
version: "0.1.0"
description: "{一句话描述本场景的业务价值}"
author: "{your-name}"

input_schema:
  type: "object"
  required: ["required_field_1"]
  properties:
    required_field_1:
      type: "string"
      description: "说明"
    optional_field_1:
      type: "string"
      description: "说明"
      default: ""

nodes:
  - id: "step-1"
    name: "第一步"
    type: "skill"
    skill_ref: "skills/{skill-name}.yaml"
    input:
      field: "{{input.required_field_1}}"
    output:
      name: "step_1_result"

  - id: "step-2"
    name: "第二步"
    type: "agent"
    agent_ref: "agents/{agent-name}"
    input:
      data: "{{nodes.step-1.output.step_1_result}}"
    output:
      name: "step_2_result"
    depends_on: ["step-1"]

  - id: "quality-gate"
    name: "质量门禁"
    type: "checkpoint"
    checkpoint_ref: "evaluations/{checkpoint-name}.yaml"
    input: "{{nodes.step-2.output.step_2_result}}"
    depends_on: ["step-2"]
    branches:
      pass:
        next: "end"
      fail:
        next: "human-escalation"

  - id: "human-escalation"
    name: "人工升级"
    type: "human"
    action: "pause_and_notify"
    notification:
      channel: "slack"
      message: "场景 {your-scenario-id} 需要人工介入"

edges:
  - from: "start"
    to: "step-1"
  - from: "step-1"
    to: "step-2"
  - from: "step-2"
    to: "quality-gate"
  - from: "quality-gate"
    to: "end"
    condition: "branch == pass"
  - from: "quality-gate"
    to: "human-escalation"
    condition: "branch == fail"
