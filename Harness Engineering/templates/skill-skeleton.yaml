skill_id: "{your-skill-id}"
version: "0.1.0"
description: "{一句话描述本技能的原子能力}"
author: "{your-name}"

interface:
  input_schema:
    type: "object"
    required: ["required_field_1"]
    properties:
      required_field_1:
        type: "string"
        description: "必填字段说明"
      optional_field_1:
        type: "string"
        default: ""
        description: "可选字段说明"
  output_schema:
    type: "object"
    required: ["result"]
    properties:
      result:
        type: "string"
        description: "输出结果说明"
      metadata:
        type: "object"
        description: "附加元数据"

implementation:
  type: "code"            # code | llm | api | hybrid
  runtime: "python"       # 若 type 为 code，填写运行时
  entry: "{module}.{function}"
  dependencies:
    - "{package}>=1.0.0"
  # 若 type 为 llm，使用以下配置替代 runtime/entry
  # prompt_ref: "prompts/{your-prompt}/v1.md"
  # model:
  #   provider: "openai"
  #   name: "gpt-4o"
  #   temperature: 0.2

error_handling:
  strategy: "fail_fast"   # fail_fast | retry | fallback
  max_retries: 0
  fallback: null
  on_error:
    output:
      status: "error"
      error_code: "{YOUR_ERROR_CODE}"
      message: "错误描述"

examples:
  - input:
      required_field_1: "示例输入"
    output:
      result: "示例输出"
      metadata: {}

observability:
  metrics:
    - "execution_time_ms"
    - "success_rate"
  logs:
    level: "INFO"
