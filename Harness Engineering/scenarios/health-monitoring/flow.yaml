scenario_id: "health-monitoring"
version: "1.0.0"
description: "为服务设计完整的可观测性方案"
author: "harness-team"

input_schema:
  type: "object"
  required: ["service_name", "tech_stack", "slo"]
  properties:
    service_name:
      type: "string"
      description: "服务名称"
    tech_stack:
      type: "string"
      description: "技术栈"
    slo:
      type: "string"
      description: "服务级别目标（可用性、延迟、错误率）"
    alert_channels:
      type: "string"
      default: "slack"
      description: "告警渠道（slack, pagerduty, email）"
    existing_monitoring:
      type: "string"
      default: ""
      description: "现有监控体系（如 Prometheus, Datadog）"

nodes:
  - id: "design-monitoring"
    name: "可观测性设计"
    type: "agent"
    agent_ref: "agents/devops-engineer"
    input:
      service_name: "{{input.service_name}}"
      tech_stack: "{{input.tech_stack}}"
      slo: "{{input.slo}}"
      alert_channels: "{{input.alert_channels}}"
      existing_monitoring: "{{input.existing_monitoring}}"
    output:
      name: "monitoring_draft"
    instructions:
      - "instructions/system/monitoring-system.md"
      - "instructions/safety/data-privacy.md"
      - "instructions/safety/no-secrets-leak.md"
    prompts:
      main: "prompts/health-monitoring/v1.md"

  - id: "generate-rules"
    name: "生成告警规则"
    type: "skill"
    skill_ref: "skills/monitoring-rule-builder.yaml"
    input:
      monitoring_spec: "{{nodes.design-monitoring.output.monitoring_draft}}"
      format: "prometheus"
    output:
      name: "alert_rules_yaml"
    depends_on: ["design-monitoring"]

  - id: "schema-validate"
    name: "Schema 校验"
    type: "skill"
    skill_ref: "skills/schema-validator.yaml"
    input:
      data: "{{nodes.design-monitoring.output.monitoring_draft}}"
      schema_name: "monitoring-output-schema"
    output:
      name: "validation_result"
    depends_on: ["design-monitoring"]

  - id: "merge-spec"
    name: "监控方案合并"
    type: "skill"
    skill_ref: "skills/report-merger.yaml"
    input:
      monitoring: "{{nodes.design-monitoring.output.monitoring_draft}}"
      alert_rules: "{{nodes.generate-rules.output.alert_rules_yaml}}"
    output:
      name: "final_spec"
    depends_on: ["generate-rules", "schema-validate"]

  - id: "quality-gate"
    name: "质量门禁"
    type: "checkpoint"
    checkpoint_ref: "evaluations/monitoring-checkpoint.yaml"
    input: "{{nodes.merge-spec.output.final_spec}}"
    depends_on: ["merge-spec"]
    branches:
      pass:
        description: "评估通过"
        condition: "checkpoint.score >= 4.0 AND checkpoint.mandatory_all_pass"
        next: "notify-success"
      conditional:
        description: "有条件通过（告警阈值待调优）"
        condition: "checkpoint.score >= 3.0 AND checkpoint.score < 4.0"
        next: "human-review"
      fail:
        description: "未通过"
        condition: "checkpoint.score < 3.0 OR checkpoint.mandatory_any_fail"
        next: "human-escalation"

  - id: "human-review"
    name: "人工审阅"
    type: "human"
    action: "pause_and_notify"
    notification:
      channel: "slack"
      mention: "@sre-lead"
      message: "📊 监控方案有待确认项，请审阅告警阈值与 Oncall 路径。"
    input:
      spec: "{{nodes.merge-spec.output.final_spec}}"
    output:
      name: "human_feedback"
      schema:
        type: "object"
        properties:
          approved:
            type: "boolean"
          threshold_adjustments:
            type: "string"

  - id: "apply-review"
    name: "应用审阅意见"
    type: "skill"
    skill_ref: "skills/report-merger.yaml"
    input:
      spec: "{{nodes.merge-spec.output.final_spec}}"
      feedback: "{{nodes.human-review.output.human_feedback}}"
    output:
      name: "reviewed_spec"
    depends_on: ["human-review"]

  - id: "human-escalation"
    name: "人工升级"
    type: "human"
    action: "pause_and_notify"
    notification:
      channel: "slack"
      mention: "@sre-lead @tech-lead"
      message: "🔴 健康监控质量门禁未通过，需人工复核并决定重试或终止。"
    output:
      name: "human_decision"
      schema:
        type: "object"
        properties:
          decision:
            type: "string"
            enum: ["retry", "terminate", "override"]
          comment:
            type: "string"

  - id: "notify-success"
    name: "通知通过"
    type: "skill"
    skill_ref: "skills/notification.yaml"
    input:
      channel: "sre_channel"
      message: "✅ 健康监控方案设计完成，可观测性规范已通过质量门禁。"
      report: "{{nodes.merge-spec.output.final_spec}}"

  - id: "feedback-package"
    name: "生成反馈包"
    type: "skill"
    skill_ref: "skills/report-merger.yaml"
    input:
      monitoring_spec: "{{nodes.merge-spec.output.final_spec}}"
      mode: "feedback-package"
    output:
      name: "feedback_for_p1"
    depends_on: ["merge-spec"]

  - id: "archive"
    name: "归档日志"
    type: "skill"
    skill_ref: "skills/trace-archiver.yaml"
    input:
      scenario_id: "health-monitoring"
      service_name: "{{input.service_name}}"
      final_output: "{{nodes.merge-spec.output.final_spec}}"
      feedback_package: "{{nodes.feedback-package.output.feedback_for_p1}}"
      checkpoint_result: "{{nodes.quality-gate.output}}"
    always_run: true

edges:
  - from: "start"
    to: "design-monitoring"
  - from: "design-monitoring"
    to: "generate-rules"
  - from: "design-monitoring"
    to: "schema-validate"
  - from: "generate-rules"
    to: "merge-spec"
  - from: "schema-validate"
    to: "merge-spec"
  - from: "merge-spec"
    to: "quality-gate"
  - from: "merge-spec"
    to: "feedback-package"
  - from: "quality-gate"
    to: "notify-success"
    condition: "branch == pass"
  - from: "quality-gate"
    to: "human-review"
    condition: "branch == conditional"
  - from: "quality-gate"
    to: "human-escalation"
    condition: "branch == fail"
  - from: "human-review"
    to: "apply-review"
  - from: "apply-review"
    to: "archive"
  - from: "notify-success"
    to: "archive"
  - from: "human-escalation"
    to: "archive"
  - from: "feedback-package"
    to: "archive"

observability:
  trace_id_header: "x-harness-trace-id"
  log_level: "INFO"
  metrics:
    - node_latency_ms
    - checkpoint_score
    - human_escalation_count
