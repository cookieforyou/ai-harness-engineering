scenario_id: "tech-arch-design"
version: "1.0.0"
description: "基于 RFC 设计技术架构与 ADR"
author: "harness-team"

input_schema:
  type: "object"
  required: ["rfc_doc", "constraints"]
  properties:
    rfc_doc:
      type: "object"
      description: "P1 阶段输出的结构化 RFC"
    constraints:
      type: "string"
      description: "约束条件（预算、团队技能、合规、性能 SLO）"
    existing_system:
      type: "string"
      default: ""
      description: "现有系统描述（如有技术债或存量服务）"
    focus_areas:
      type: "string"
      default: ""
      description: "设计重点（如 scalability, security, cost-efficiency）"

nodes:
  - id: "stack-match"
    name: "技术栈匹配"
    type: "skill"
    skill_ref: "skills/tech-stack-matcher.yaml"
    input:
      requirements: "{{input.rfc_doc.requirements}}"
      constraints: "{{input.constraints}}"
      focus_areas: "{{input.focus_areas}}"
    output:
      name: "stack_recommendation"

  - id: "arch-design"
    name: "架构设计"
    type: "agent"
    agent_ref: "agents/solution-architect"
    input:
      rfc_doc: "{{input.rfc_doc}}"
      constraints: "{{input.constraints}}"
      existing_system: "{{input.existing_system}}"
      focus_areas: "{{input.focus_areas}}"
      stack_recommendation: "{{nodes.stack-match.output.stack_recommendation}}"
    output:
      name: "adr_draft"
    depends_on: ["stack-match"]
    instructions:
      - "instructions/system/architecture-design-system.md"
      - "instructions/safety/data-privacy.md"
      - "instructions/safety/no-secrets-leak.md"
    prompts:
      main: "prompts/tech-arch-design/v1.md"

  - id: "schema-validate"
    name: "Schema 校验"
    type: "skill"
    skill_ref: "skills/schema-validator.yaml"
    input:
      data: "{{nodes.arch-design.output.adr_draft}}"
      schema_name: "adr-output-schema"
    output:
      name: "validation_result"
    depends_on: ["arch-design"]

  - id: "security-audit"
    name: "架构安全审计"
    type: "skill"
    skill_ref: "skills/security-audit.yaml"
    input:
      architecture: "{{nodes.arch-design.output.adr_draft.architecture}}"
      api_contracts: "{{nodes.arch-design.output.adr_draft.api_contracts}}"
      mode: "architecture"
    output:
      name: "security_findings"
    depends_on: ["arch-design"]

  - id: "merge-adr"
    name: "ADR 合并"
    type: "skill"
    skill_ref: "skills/report-merger.yaml"
    input:
      adr: "{{nodes.arch-design.output.adr_draft}}"
      security_notes: "{{nodes.security-audit.output.security_findings}}"
    output:
      name: "final_adr"
    depends_on: ["schema-validate", "security-audit"]

  - id: "quality-gate"
    name: "质量门禁"
    type: "checkpoint"
    checkpoint_ref: "evaluations/tech-arch-checkpoint.yaml"
    input: "{{nodes.merge-adr.output.final_adr}}"
    depends_on: ["merge-adr"]
    branches:
      pass:
        description: "评估通过"
        condition: "checkpoint.score >= 4.0 AND checkpoint.mandatory_all_pass"
        next: "notify-success"
      conditional:
        description: "有条件通过（存在中低风险）"
        condition: "checkpoint.score >= 3.0 AND checkpoint.score < 4.0"
        next: "human-review"
      fail:
        description: "未通过"
        condition: "checkpoint.score < 3.0 OR checkpoint.mandatory_any_fail"
        next: "human-escalation"

  - id: "human-review"
    name: "人工审阅"
    type: "human"
    action: "pause_and_notify"
    notification:
      channel: "slack"
      mention: "@tech-lead"
      message: "📐 技术架构方案有待确认风险项，请审阅并决策。"
    input:
      adr: "{{nodes.merge-adr.output.final_adr}}"
    output:
      name: "human_feedback"
      schema:
        type: "object"
        properties:
          risk_accepted:
            type: "boolean"
          adjustments:
            type: "string"

  - id: "apply-review"
    name: "应用审阅意见"
    type: "skill"
    skill_ref: "skills/report-merger.yaml"
    input:
      adr: "{{nodes.merge-adr.output.final_adr}}"
      feedback: "{{nodes.human-review.output.human_feedback}}"
    output:
      name: "reviewed_adr"
    depends_on: ["human-review"]

  - id: "human-escalation"
    name: "人工升级"
    type: "human"
    action: "pause_and_notify"
    notification:
      channel: "slack"
      mention: "@tech-lead @cto"
      message: "🔴 技术架构质量门禁未通过，需人工复核并决定重试或终止。"
    output:
      name: "human_decision"
      schema:
        type: "object"
        properties:
          decision:
            type: "string"
            enum: ["retry", "terminate", "override"]
          comment:
            type: "string"

  - id: "notify-success"
    name: "通知通过"
    type: "skill"
    skill_ref: "skills/notification.yaml"
    input:
      channel: "architecture_channel"
      message: "✅ 技术架构设计完成，ADR 已通过质量门禁。"
      report: "{{nodes.merge-adr.output.final_adr}}"

  - id: "archive"
    name: "归档日志"
    type: "skill"
    skill_ref: "skills/trace-archiver.yaml"
    input:
      scenario_id: "tech-arch-design"
      adr_id: "{{nodes.merge-adr.output.final_adr.adr_title}}"
      final_output: "{{nodes.merge-adr.output.final_adr}}"
      checkpoint_result: "{{nodes.quality-gate.output}}"
    always_run: true

edges:
  - from: "start"
    to: "stack-match"
  - from: "stack-match"
    to: "arch-design"
  - from: "arch-design"
    to: "schema-validate"
  - from: "arch-design"
    to: "security-audit"
  - from: "schema-validate"
    to: "merge-adr"
  - from: "security-audit"
    to: "merge-adr"
  - from: "merge-adr"
    to: "quality-gate"
  - from: "quality-gate"
    to: "notify-success"
    condition: "branch == pass"
  - from: "quality-gate"
    to: "human-review"
    condition: "branch == conditional"
  - from: "quality-gate"
    to: "human-escalation"
    condition: "branch == fail"
  - from: "human-review"
    to: "apply-review"
  - from: "apply-review"
    to: "archive"
  - from: "notify-success"
    to: "archive"
  - from: "human-escalation"
    to: "archive"

observability:
  trace_id_header: "x-harness-trace-id"
  log_level: "INFO"
  metrics:
    - node_latency_ms
    - checkpoint_score
    - human_escalation_count
