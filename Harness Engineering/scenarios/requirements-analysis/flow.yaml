scenario_id: "requirements-analysis"
version: "1.0.0"
description: "将原始需求转化为结构化 RFC 文档"
author: "harness-team"

input_schema:
  type: "object"
  required: ["raw_requirements", "source_type", "project_context"]
  properties:
    raw_requirements:
      type: "string"
      description: "原始需求文本（PRD、会议纪要、用户访谈）"
    source_type:
      type: "string"
      enum: ["prd", "meeting_notes", "user_interview"]
      description: "需求来源类型"
    project_context:
      type: "string"
      description: "项目背景、目标用户、技术约束"
    focus_areas:
      type: "string"
      default: ""
      description: "分析重点（如 compliance, performance, ux）"

nodes:
  - id: "extract-requirements"
    name: "需求提取与结构化"
    type: "agent"
    agent_ref: "agents/product-analyst"
    input:
      raw_requirements: "{{input.raw_requirements}}"
      source_type: "{{input.source_type}}"
      project_context: "{{input.project_context}}"
      focus_areas: "{{input.focus_areas}}"
    output:
      name: "rfc_draft"
    instructions:
      - "instructions/system/requirements-analysis-system.md"
      - "instructions/safety/data-privacy.md"
      - "instructions/safety/no-secrets-leak.md"
    prompts:
      main: "prompts/requirements-analysis/v1.md"

  - id: "schema-validate"
    name: "Schema 校验"
    type: "skill"
    skill_ref: "skills/schema-validator.yaml"
    input:
      data: "{{nodes.extract-requirements.output.rfc_draft}}"
      schema_name: "rfc-output-schema"
    output:
      name: "validation_result"
    depends_on: ["extract-requirements"]

  - id: "conflict-detect"
    name: "冲突与隐含需求检测"
    type: "skill"
    skill_ref: "skills/requirements-extractor.yaml"
    input:
      rfc: "{{nodes.extract-requirements.output.rfc_draft}}"
      mode: "conflict_and_gap_detection"
    output:
      name: "enhancement_suggestions"
    depends_on: ["extract-requirements"]

  - id: "merge-rfc"
    name: "RFC 合并与增强"
    type: "skill"
    skill_ref: "skills/report-merger.yaml"
    input:
      primary: "{{nodes.extract-requirements.output.rfc_draft}}"
      supplementary: "{{nodes.conflict-detect.output.enhancement_suggestions}}"
    output:
      name: "final_rfc"
    depends_on: ["schema-validate", "conflict-detect"]

  - id: "quality-gate"
    name: "质量门禁"
    type: "checkpoint"
    checkpoint_ref: "evaluations/requirements-analysis-checkpoint.yaml"
    input: "{{nodes.merge-rfc.output.final_rfc}}"
    depends_on: ["merge-rfc"]
    branches:
      pass:
        description: "评估通过"
        condition: "checkpoint.score >= 4.0 AND checkpoint.mandatory_all_pass"
        next: "notify-success"
      conditional:
        description: "有条件通过（存在待澄清问题）"
        condition: "checkpoint.score >= 3.0 AND checkpoint.score < 4.0"
        next: "human-clarification"
      fail:
        description: "未通过"
        condition: "checkpoint.score < 3.0 OR checkpoint.mandatory_any_fail"
        next: "human-escalation"

  - id: "human-clarification"
    name: "人工澄清"
    type: "human"
    action: "pause_and_notify"
    notification:
      channel: "slack"
      mention: "@product-manager"
      message: "📋 RFC 存在待澄清问题，请查看 open_questions 并补充上下文。"
    input:
      rfc: "{{nodes.merge-rfc.output.final_rfc}}"
    output:
      name: "human_feedback"
      schema:
        type: "object"
        properties:
          clarified_questions:
            type: "array"
            items:
              type: "object"
              properties:
                question:
                  type: "string"
                answer:
                  type: "string"
          priority_adjustments:
            type: "array"
            items:
              type: "object"
              properties:
                req_id:
                  type: "string"
                new_priority:
                  type: "string"
                  enum: ["must_have", "should_have", "nice_to_have"]

  - id: "apply-clarification"
    name: "应用澄清结果"
    type: "skill"
    skill_ref: "skills/report-merger.yaml"
    input:
      rfc: "{{nodes.merge-rfc.output.final_rfc}}"
      feedback: "{{nodes.human-clarification.output.human_feedback}}"
    output:
      name: "clarified_rfc"
    depends_on: ["human-clarification"]

  - id: "human-escalation"
    name: "人工升级"
    type: "human"
    action: "pause_and_notify"
    notification:
      channel: "slack"
      mention: "@product-manager @tech-lead"
      message: "🔴 需求分析质量门禁未通过，需人工复核并决定重试或终止。"
    output:
      name: "human_decision"
      schema:
        type: "object"
        properties:
          decision:
            type: "string"
            enum: ["retry", "terminate", "override"]
          comment:
            type: "string"

  - id: "notify-success"
    name: "通知通过"
    type: "skill"
    skill_ref: "skills/notification.yaml"
    input:
      channel: "product_channel"
      message: "✅ 需求分析完成，RFC 已通过质量门禁。"
      report: "{{nodes.merge-rfc.output.final_rfc}}"

  - id: "archive"
    name: "归档日志"
    type: "skill"
    skill_ref: "skills/trace-archiver.yaml"
    input:
      scenario_id: "requirements-analysis"
      rfc_id: "{{nodes.merge-rfc.output.final_rfc.rfc_title}}"
      final_output: "{{nodes.merge-rfc.output.final_rfc}}"
      checkpoint_result: "{{nodes.quality-gate.output}}"
    always_run: true

edges:
  - from: "start"
    to: "extract-requirements"
  - from: "extract-requirements"
    to: "schema-validate"
  - from: "extract-requirements"
    to: "conflict-detect"
  - from: "schema-validate"
    to: "merge-rfc"
  - from: "conflict-detect"
    to: "merge-rfc"
  - from: "merge-rfc"
    to: "quality-gate"
  - from: "quality-gate"
    to: "notify-success"
    condition: "branch == pass"
  - from: "quality-gate"
    to: "human-clarification"
    condition: "branch == conditional"
  - from: "quality-gate"
    to: "human-escalation"
    condition: "branch == fail"
  - from: "human-clarification"
    to: "apply-clarification"
  - from: "apply-clarification"
    to: "archive"
  - from: "notify-success"
    to: "archive"
  - from: "human-escalation"
    to: "archive"

observability:
  trace_id_header: "x-harness-trace-id"
  log_level: "INFO"
  metrics:
    - node_latency_ms
    - checkpoint_score
    - human_escalation_count
