scenario_id: "code-review"
version: "1.0.0"
description: "自动化代码审查与报告生成"
author: "harness-team"

input_schema:
  type: "object"
  required: ["pr_id", "repo", "diff"]
  properties:
    pr_id:
      type: "string"
      description: "Pull Request 唯一标识"
    repo:
      type: "string"
      description: "代码仓库名"
    diff:
      type: "string"
      description: "统一 diff 格式的代码变更"
    context:
      type: "string"
      description: "项目技术栈与背景说明"
      default: ""

nodes:
  - id: "parse-diff"
    name: "Diff 解析"
    type: "skill"
    skill_ref: "skills/diff-parser.yaml"
    input:
      raw_diff: "{{input.diff}}"
    output:
      name: "parsed_files"
      schema: "skills/diff-parser.yaml#output"
    retry: 2

  - id: "security-scan"
    name: "安全扫描"
    type: "skill"
    skill_ref: "skills/security-audit.yaml"
    input:
      files: "{{nodes.parse-diff.output.parsed_files}}"
    output:
      name: "security_findings"
    depends_on: ["parse-diff"]

  - id: "deep-review"
    name: "深度代码审查"
    type: "agent"
    agent_ref: "agents/senior-engineer"
    input:
      pr_title: "{{input.pr_id}}"
      pr_description: "{{input.context}}"
      diff: "{{input.diff}}"
    output:
      name: "review_report"
    depends_on: ["parse-diff"]
    instructions:
      - "instructions/system/code-review-system.md"
      - "instructions/safety/data-privacy.md"
      - "instructions/safety/no-secrets-leak.md"
    prompts:
      main: "prompts/code-review/v1.md"

  - id: "merge-report"
    name: "报告合并"
    type: "skill"
    skill_ref: "skills/report-merger.yaml"
    input:
      security_findings: "{{nodes.security-scan.output.security_findings}}"
      review_report: "{{nodes.deep-review.output.review_report}}"
    output:
      name: "final_report"
    depends_on: ["security-scan", "deep-review"]

  - id: "quality-gate"
    name: "质量门禁"
    type: "checkpoint"
    checkpoint_ref: "evaluations/code-review-checkpoint.yaml"
    input: "{{nodes.merge-report.output.final_report}}"
    depends_on: ["merge-report"]
    branches:
      pass:
        description: "评估通过"
        condition: "checkpoint.score >= 4.0 AND checkpoint.mandatory_all_pass"
        next: "notify-success"
      conditional:
        description: "有条件通过（中低风险问题）"
        condition: "checkpoint.score >= 3.0 AND checkpoint.score < 4.0"
        next: "notify-partial"
      fail:
        description: "未通过（高风险或安全违规）"
        condition: "checkpoint.score < 3.0 OR checkpoint.mandatory_any_fail"
        next: "human-escalation"

  - id: "notify-success"
    name: "通知通过"
    type: "skill"
    skill_ref: "skills/notification.yaml"
    input:
      channel: "pr_bot"
      message: "✅ 代码审查通过，无高危问题。"
      report: "{{nodes.merge-report.output.final_report}}"

  - id: "notify-partial"
    name: "通知有条件通过"
    type: "skill"
    skill_ref: "skills/notification.yaml"
    input:
      channel: "pr_bot"
      message: "⚠️ 代码审查有条件通过，请查看中等优先级建议。"
      report: "{{nodes.merge-report.output.final_report}}"

  - id: "human-escalation"
    name: "人工升级"
    type: "human"
    action: "pause_and_notify"
    notification:
      channel: "slack"
      mention: "@oncall-sre"
      message: "🔴 PR {{input.pr_id}} 代码审查未通过质量门禁，需人工复核。"
    output:
      name: "human_decision"
      schema:
        type: "object"
        properties:
          decision:
            type: "string"
            enum: ["approve", "reject", "retry"]
          comment:
            type: "string"

  - id: "archive"
    name: "归档日志"
    type: "skill"
    skill_ref: "skills/trace-archiver.yaml"
    input:
      scenario_id: "code-review"
      pr_id: "{{input.pr_id}}"
      final_report: "{{nodes.merge-report.output.final_report}}"
      checkpoint_result: "{{nodes.quality-gate.output}}"
    always_run: true

edges:
  - from: "start"
    to: "parse-diff"
  - from: "parse-diff"
    to: "security-scan"
  - from: "parse-diff"
    to: "deep-review"
  - from: "security-scan"
    to: "merge-report"
  - from: "deep-review"
    to: "merge-report"
  - from: "merge-report"
    to: "quality-gate"
  - from: "quality-gate"
    to: "notify-success"
    condition: "branch == pass"
  - from: "quality-gate"
    to: "notify-partial"
    condition: "branch == conditional"
  - from: "quality-gate"
    to: "human-escalation"
    condition: "branch == fail"
  - from: "notify-success"
    to: "archive"
  - from: "notify-partial"
    to: "archive"
  - from: "human-escalation"
    to: "archive"

observability:
  trace_id_header: "x-harness-trace-id"
  log_level: "INFO"
  metrics:
    - node_latency_ms
    - checkpoint_score
    - human_escalation_count
