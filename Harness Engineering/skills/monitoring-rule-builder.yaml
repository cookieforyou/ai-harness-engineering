skill_id: "monitoring-rule-builder"
version: "1.0.0"
description: "基于服务特征与 SLO 定义，生成监控指标、告警规则与健康检查配置。"
author: "harness-team"

tags: ["observability", "monitoring", "alerting"]

interface:
  input_schema:
    type: "object"
    required: ["service_name", "slo"]
    properties:
      service_name: { type: "string" }
      slo:
        type: "object"
        required: ["availability", "latency_p99_ms"]
        properties:
          availability:
            type: "number"
            description: "可用性目标，如 0.999"
          latency_p99_ms: { type: "integer" }
          error_rate:
            type: "number"
            description: "错误率目标，如 0.001"
      tech_stack:
        type: "object"
        properties:
          framework: { type: "string" }
          deployment_platform: { type: "string" }
      alert_channels:
        type: "array"
        items: { type: "string" }
        default: ["slack"]
  output_schema:
    type: "object"
    required: ["metrics", "alert_rules", "health_checks"]
    properties:
      metrics:
        type: "array"
        items:
          type: "object"
          properties:
            name: { type: "string" }
            type:
              type: "string"
              enum: ["counter", "gauge", "histogram"]
            description: { type: "string" }
            labels:
              type: "array"
              items: { type: "string" }
      alert_rules:
        type: "array"
        items:
          type: "object"
          properties:
            name: { type: "string" }
            expr: { type: "string" }
            severity:
              type: "string"
              enum: ["critical", "warning", "info"]
            for: { type: "string" }
            annotations:
              type: "object"
              properties:
                summary: { type: "string" }
                description: { type: "string" }
      health_checks:
        type: "array"
        items:
          type: "object"
          properties:
            name: { type: "string" }
            endpoint: { type: "string" }
            expected_status: { type: "integer" }
            timeout_seconds: { type: "integer" }
      dashboards:
        type: "array"
        items:
          type: "object"
          properties:
            title: { type: "string" }
            panels:
              type: "array"
              items:
                type: "object"
                properties:
                  title: { type: "string" }
                  query: { type: "string" }

implementation:
  type: "llm"
  prompt_ref: "prompts/health-monitoring/v1.md"

error_handling:
  strategy: "graceful_degradation"
  fallback:
    output:
      metrics: []
      alert_rules: []
      health_checks: []
      dashboards: []
      degraded: true
      note: "监控规则生成降级运行，建议人工复核 SLO 定义"

observability:
  metrics:
    - "execution_time_ms"
    - "alert_rules_generated"
