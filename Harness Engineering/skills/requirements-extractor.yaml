skill_id: "requirements-extractor"
version: "1.0.0"
description: "从非结构化需求文档（PRD、会议纪要、用户访谈）中提取结构化需求条目，分类并去重。"
author: "harness-team"

tags: ["parsing", "nlp", "requirements"]

interface:
  input_schema:
    type: "object"
    required: ["raw_text"]
    properties:
      raw_text:
        type: "string"
        description: "原始需求文本，支持 Markdown、纯文本"
      source_type:
        type: "string"
        enum: ["prd", "meeting_notes", "user_interview", "ticket"]
        default: "prd"
      project_context:
        type: "string"
        description: "项目背景与技术栈，用于辅助分类"
        default: ""
  output_schema:
    type: "object"
    required: ["requirements", "summary"]
    properties:
      requirements:
        type: "array"
        items:
          type: "object"
          required: ["id", "type", "description", "priority"]
          properties:
            id:
              type: "string"
              description: "需求唯一标识，如 REQ-001"
            type:
              type: "string"
              enum: ["functional", "non_functional", "compliance", "constraint"]
            description:
              type: "string"
            priority:
              type: "string"
              enum: ["must_have", "should_have", "nice_to_have"]
            acceptance_criteria:
              type: "array"
              items:
                type: "string"
            source_reference:
              type: "string"
              description: "原始文本中的引用位置或段落"
      summary:
        type: "object"
        properties:
          total_count: { type: "integer" }
          by_type:
            type: "object"
            properties:
              functional: { type: "integer" }
              non_functional: { type: "integer" }
              compliance: { type: "integer" }
              constraint: { type: "integer" }
          conflicts_detected:
            type: "array"
            items:
              type: "object"
              properties:
                req_ids:
                  type: "array"
                  items: { type: "string" }
                description: { type: "string" }

implementation:
  type: "hybrid"
  steps:
    - step: 1
      type: "llm"
      description: "使用 LLM 进行语义提取与分类"
      prompt_ref: "prompts/requirements-analysis/v1.md"
    - step: 2
      type: "code"
      runtime: "python"
      description: "基于规则的去重与冲突检测"
      entry: "requirements_extractor.deduplicate_and_detect_conflicts"

error_handling:
  strategy: "graceful_degradation"
  fallback:
    output:
      requirements: []
      summary:
        total_count: 0
        by_type: {}
        conflicts_detected: []
      degraded: true
      note: "需求提取降级运行，建议人工复核"

examples:
  - name: "PRD 提取"
    input:
      raw_text: "用户需要支持通过微信扫码登录。系统必须在 2 秒内完成认证。符合等保三级要求。"
      source_type: "prd"
    output:
      requirements:
        - id: "REQ-001"
          type: "functional"
          description: "支持通过微信扫码登录"
          priority: "must_have"
          acceptance_criteria: ["用户可扫描微信二维码完成登录", "未绑定微信的用户需先完成绑定"]
        - id: "REQ-002"
          type: "non_functional"
          description: "认证流程必须在 2 秒内完成"
          priority: "must_have"
        - id: "REQ-003"
          type: "compliance"
          description: "符合等保三级要求"
          priority: "must_have"
      summary:
        total_count: 3
        by_type:
          functional: 1
          non_functional: 1
          compliance: 1
        conflicts_detected: []

observability:
  metrics:
    - name: "execution_time_ms"
      type: "histogram"
    - name: "requirements_extracted"
      type: "counter"
    - name: "conflicts_detected"
      type: "counter"
