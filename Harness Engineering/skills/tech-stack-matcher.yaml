skill_id: "tech-stack-matcher"
version: "1.0.0"
description: "基于项目约束条件（性能、团队技能、预算、合规）推荐技术栈，并给出选型矩阵与风险评估。"
author: "harness-team"

tags: ["recommendation", "architecture", "decision-support"]

interface:
  input_schema:
    type: "object"
    required: ["requirements_summary", "constraints"]
    properties:
      requirements_summary:
        type: "object"
        description: "需求分析阶段的 summary 输出"
        properties:
          total_count: { type: "integer" }
          by_type:
            type: "object"
            properties:
              functional: { type: "integer" }
              non_functional: { type: "integer" }
      constraints:
        type: "object"
        required: ["team_skills"]
        properties:
          team_skills:
            type: "array"
            items: { type: "string" }
            description: "团队已有技术栈"
          budget_level:
            type: "string"
            enum: ["low", "medium", "high"]
            default: "medium"
          compliance:
            type: "array"
            items: { type: "string" }
            description: "合规要求，如 GDPR、等保三级"
            default: []
          performance_slo:
            type: "object"
            properties:
              latency_p99_ms: { type: "integer" }
              throughput_rps: { type: "integer" }
      existing_stack:
        type: "string"
        description: "现有技术栈描述（如有存量系统）"
        default: ""
  output_schema:
    type: "object"
    required: ["recommendations", "trade_off_analysis"]
    properties:
      recommendations:
        type: "array"
        items:
          type: "object"
          required: ["category", "primary", "alternatives"]
          properties:
            category:
              type: "string"
              enum: ["database", "cache", "message_queue", "framework", "deployment", "observability"]
            primary:
              type: "object"
              required: ["name", "rationale"]
              properties:
                name: { type: "string" }
                rationale: { type: "string" }
                risk_level:
                  type: "string"
                  enum: ["low", "medium", "high"]
            alternatives:
              type: "array"
              items:
                type: "object"
                properties:
                  name: { type: "string" }
                  rationale: { type: "string" }
      trade_off_analysis:
        type: "object"
        properties:
          consistency_vs_availability: { type: "string" }
          cost_vs_performance: { type: "string" }
          team_velocity_vs_innovation: { type: "string" }
      risk_summary:
        type: "object"
        properties:
          top_risks:
            type: "array"
            items:
              type: "object"
              properties:
                description: { type: "string" }
                mitigation: { type: "string" }

implementation:
  type: "llm"
  prompt_ref: "prompts/tech-arch-design/v1.md"

error_handling:
  strategy: "graceful_degradation"
  fallback:
    output:
      recommendations: []
      trade_off_analysis: {}
      risk_summary:
        top_risks:
          - description: "技术栈推荐降级运行"
            mitigation: "建议人工复核需求与约束"

observability:
  metrics:
    - "execution_time_ms"
    - "recommendation_count"
