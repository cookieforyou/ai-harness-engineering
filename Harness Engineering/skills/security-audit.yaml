skill_id: "security-audit"
version: "1.0.0"
description: "对结构化代码变更进行安全漏洞模式扫描，识别密钥泄露、危险函数、注入风险等。"
author: "harness-team"

tags: ["security", "static-analysis", "scanning"]

interface:
  input_schema:
    type: "object"
    required: ["files"]
    properties:
      files:
        type: "array"
        description: "diff-parser 输出的结构化文件列表"
        items:
          type: "object"
          properties:
            file_path: { type: "string" }
            hunks:
              type: "array"
              items:
                type: "object"
                properties:
                  lines:
                    type: "array"
                    items:
                      type: "object"
                      properties:
                        type: { type: "string" }
                        content: { type: "string" }
  output_schema:
    type: "object"
    required: ["findings", "risk_score"]
    properties:
      findings:
        type: "array"
        items:
          type: "object"
          required: ["severity", "type", "file_path", "line_no", "message"]
          properties:
            severity:
              type: "string"
              enum: ["critical", "high", "medium", "low", "info"]
            type:
              type: "string"
              enum: ["secret-leak", "injection", "dangerous-function", "permission-issue", "misconfiguration"]
            file_path: { type: "string" }
            line_no: { type: "integer" }
            message: { type: "string" }
            suggestion: { type: "string" }
      risk_score:
        type: "number"
        description: "0-10 的整体风险评分，10 为最高危"

implementation:
  type: "hybrid"
  steps:
    - step: 1
      type: "code"
      runtime: "python"
      description: "基于正则和 AST 的快速模式匹配"
      entry: "security_audit.scan_patterns"
    - step: 2
      type: "llm"
      description: "对疑似高风险片段进行语义级二次确认"
      prompt_ref: "prompts/security-audit-semantic.md"
      condition: "step1.risk_score > 5"

error_handling:
  strategy: "graceful_degradation"
  fallback:
    output:
      findings: []
      risk_score: 0
      degraded: true
      note: "安全扫描降级运行，建议人工复核"
  on_error:
    log_level: "ERROR"

rules:
  - id: "R001"
    name: "Hardcoded Secret"
    severity: "critical"
    patterns:
      - "(?i)(api[_-]?key|password|secret|token)\\s*[=:]\\s*['\"\\w-]+"
      - "(?i)(sk|ak|ghp|gpt)\\-[a-zA-Z0-9]{10,}"
  - id: "R002"
    name: "Dangerous Eval"
    severity: "critical"
    patterns:
      - "\\beval\\s*\\("
      - "\\bexec\\s*\\("
  - id: "R003"
    name: "SQL Injection Risk"
    severity: "high"
    patterns:
      - "(?i)(execute|query|raw)\\s*\\(\\s*['\"].*\\$\\{.*\\}"
      - "(?i)(execute|query|raw)\\s*\\(\\s*.*\\+.*\\+"

observability:
  metrics:
    - "execution_time_ms"
    - "findings_count"
    - "false_positive_estimate"
