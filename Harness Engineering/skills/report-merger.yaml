skill_id: "report-merger"
version: "1.0.0"
description: "合并多个来源的审查/分析结果，去重、排序并生成统一的结构化报告。"
author: "harness-team"

tags: ["aggregation", "reporting", "post-processing"]

interface:
  input_schema:
    type: "object"
    required: ["reports"]
    properties:
      reports:
        type: "array"
        description: "多个报告对象，每个对象会被统一提取 findings"
        items:
          type: "object"
          properties:
            source: { type: "string", description: "报告来源标识" }
            findings:
              type: "array"
              items:
                type: "object"
                properties:
                  severity: { type: "string" }
                  file_path: { type: "string" }
                  line_range: { type: "string" }
                  message: { type: "string" }
  output_schema:
    type: "object"
    required: ["summary", "findings"]
    properties:
      summary:
        type: "object"
        properties:
          total: { type: "integer" }
          critical: { type: "integer" }
          high: { type: "integer" }
          medium: { type: "integer" }
          low: { type: "integer" }
          info: { type: "integer" }
      findings:
        type: "array"
        items:
          type: "object"
          properties:
            id: { type: "string" }
            severity: { type: "string" }
            category: { type: "string" }
            file_path: { type: "string" }
            line_range: { type: "string" }
            message: { type: "string" }
            suggestion: { type: "string" }
            sources: { type: "array", items: { type: "string" } }

implementation:
  type: "code"
  runtime: "python"
  entry: "report_merger.merge"
  dependencies: []

logic:
  deduplication:
    strategy: "fuzzy_match"
    keys: ["file_path", "message"]
    threshold: 0.85
  sorting:
    - field: "severity"
      order: ["critical", "high", "medium", "low", "info"]
    - field: "file_path"
      order: "asc"
  id_generation: "F{index:03d}"

error_handling:
  strategy: "fail_fast"
  on_error:
    output:
      status: "error"
      error_code: "MERGE_ERROR"
      message: "报告合并过程中发生错误"

examples:
  - name: "合并安全扫描与深度审查"
    input:
      reports:
        - source: "security-scan"
          findings:
            - { severity: "critical", file_path: "src/auth.js", line_range: "15", message: "硬编码密码" }
        - source: "deep-review"
          findings:
            - { severity: "high", file_path: "src/auth.js", line_range: "15", message: "硬编码密码 admin123" }
    output:
      summary:
        total: 1
        critical: 1
        high: 0
        medium: 0
        low: 0
        info: 0
      findings:
        - id: "F001"
          severity: "critical"
          category: "security"
          file_path: "src/auth.js"
          line_range: "15"
          message: "硬编码密码"
          suggestion: "使用环境变量或密钥管理服务"
          sources: ["security-scan", "deep-review"]
