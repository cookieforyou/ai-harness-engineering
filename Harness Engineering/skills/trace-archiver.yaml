skill_id: "trace-archiver"
version: "1.0.0"
description: "将场景运行轨迹（trace）、节点输入输出、评估结果归档至持久化存储，支持审计与复盘。"
author: "harness-team"

tags: ["observability", "storage", "audit"]

interface:
  input_schema:
    type: "object"
    required: ["scenario_id", "trace_data"]
    properties:
      scenario_id: { type: "string" }
      trace_id: { type: "string" }
      trace_data:
        type: "object"
        description: "完整的执行轨迹，包含各节点输入输出与元数据"
      checkpoint_results:
        type: "array"
        description: "各评估点的结果"
  output_schema:
    type: "object"
    properties:
      archive_id: { type: "string" }
      storage_path: { type: "string" }
      retention_days: { type: "integer" }

implementation:
  type: "api"
  storage:
    primary: "s3"
    bucket_env: "HARNESS_TRACE_BUCKET"
    path_pattern: "traces/{date}/{scenario_id}/{trace_id}.json"
    compression: "gzip"
  secondary:
    type: "elasticsearch"
    index_pattern: "harness-traces-{YYYY.MM}"

retention:
  default_days: 90
  compliance_mode: true
  auto_expiry: true

error_handling:
  strategy: "best_effort"
  on_error:
    log_level: "WARN"
    alert: false

observability:
  metrics:
    - "archive_latency_ms"
    - "archive_size_bytes"
