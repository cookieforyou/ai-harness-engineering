checkpoint_id: "code-review-v1"
version: "1.0.0"
description: "代码审查场景的端到端质量门禁"
scope: "scenarios/code-review"
type: "hybrid"                    # 自动化 + 人工抽检

evaluation_refs:
  - "evaluations/quality-rubric.yaml"

metrics:
  - name: "correctness"
    ref: "quality-rubric.dimensions.correctness"
    weight: 0.35
  - name: "completeness"
    ref: "quality-rubric.dimensions.completeness"
    weight: 0.25
  - name: "actionability"
    ref: "quality-rubric.dimensions.actionability"
    weight: 0.20
  - name: "consistency"
    ref: "quality-rubric.dimensions.consistency"
    weight: 0.10
  - name: "safety"
    ref: "quality-rubric.dimensions.safety"
    weight: 0.10

threshold:
  overall: 4.0
  per_metric_min:
    correctness: 3
    actionability: 3
  mandatory:
    - "safety"

automated_checks:
  - name: "secret_leak_detection"
    type: "regex_scan"
    target: "output"
    pattern: "(?i)(api[_-]?key|password|secret|token)\\s*[=:]\\s*['\"\\w-]+"
    action_on_match: "fail_immediately"

  - name: "high_risk_command"
    type: "keyword_list"
    target: "output"
    keywords: ["rm -rf /", "DROP TABLE", "sudo ", "chmod 777"]
    action_on_match: "fail_immediately"

human_review:
  sampling_rate: 0.1              # 10% 样本人工复核
  trigger_conditions:
    - "overall_score between 3.0 and 4.0"
    - "any mandatory metric is borderline"

retry_policy:
  max_attempts: 2
  strategy: "refine_prompt_and_retry"
  escalation_on_exhausted: true   # 重试耗尽后升级人工

dataset_ref: "evaluations/code-review-dataset.jsonl"
