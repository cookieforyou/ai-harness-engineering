checkpoint_id: "monitoring-v1"
version: "1.0.0"
description: "健康监控场景的端到端质量门禁"
scope: "scenarios/health-monitoring"
type: "hybrid"

evaluation_refs:
  - "evaluations/quality-rubric.yaml"

metrics:
  - name: "completeness"
    ref: "quality-rubric.dimensions.completeness"
    weight: 0.30
  - name: "actionability"
    ref: "quality-rubric.dimensions.actionability"
    weight: 0.25
  - name: "correctness"
    ref: "quality-rubric.dimensions.correctness"
    weight: 0.20
  - name: "consistency"
    ref: "quality-rubric.dimensions.consistency"
    weight: 0.15
  - name: "safety"
    ref: "quality-rubric.dimensions.safety"
    weight: 0.10

threshold:
  overall: 4.0
  per_metric_min:
    completeness: 3
    actionability: 4
  mandatory:
    - "safety"

automated_checks:
  - name: "schema_compliance"
    type: "json_schema"
    target: "output"
    schema_ref: "skills/schema-validator.yaml#monitoring_spec_schema"
    action_on_fail: "fail_immediately"

  - name: "slo_defined"
    type: "keyword_list"
    target: "output"
    keywords: ["availability", "latency", "error_rate"]
    action_on_no_match: "fail_immediately"

  - name: "alert_with_runbook"
    type: "keyword_list"
    target: "output"
    keywords: ["runbook", "steps", "escalation"]
    action_on_no_match: "warn"

human_review:
  sampling_rate: 0.10
  trigger_conditions:
    - "overall_score between 3.0 and 4.0"
    - "alert_rules count < 3"

retry_policy:
  max_attempts: 2
  strategy: "refine_prompt_and_retry"
  escalation_on_exhausted: true

dataset_ref: "evaluations/monitoring-dataset.jsonl"
