checkpoint_id: "tech-arch-v1"
version: "1.0.0"
description: "技术架构设计场景的端到端质量门禁"
scope: "scenarios/tech-arch-design"
type: "hybrid"

evaluation_refs:
  - "evaluations/quality-rubric.yaml"

metrics:
  - name: "correctness"
    ref: "quality-rubric.dimensions.correctness"
    weight: 0.30
  - name: "completeness"
    ref: "quality-rubric.dimensions.completeness"
    weight: 0.25
  - name: "consistency"
    ref: "quality-rubric.dimensions.consistency"
    weight: 0.20
  - name: "actionability"
    ref: "quality-rubric.dimensions.actionability"
    weight: 0.15
  - name: "safety"
    ref: "quality-rubric.dimensions.safety"
    weight: 0.10

threshold:
  overall: 4.0
  per_metric_min:
    correctness: 3
    consistency: 3
  mandatory:
    - "safety"

automated_checks:
  - name: "schema_compliance"
    type: "json_schema"
    target: "output"
    schema_ref: "skills/schema-validator.yaml#adr_schema"
    action_on_fail: "fail_immediately"

  - name: "adr_completeness"
    type: "keyword_list"
    target: "output"
    keywords: ["context", "decision", "consequences"]
    action_on_no_match: "fail_immediately"

  - name: "security_boundary_check"
    type: "keyword_list"
    target: "output"
    keywords: ["encryption", "TLS", "trust boundary"]
    action_on_no_match: "warn"

human_review:
  sampling_rate: 0.20
  trigger_conditions:
    - "overall_score between 3.0 and 4.0"
    - "risk_level high in any primary tech_stack recommendation"

retry_policy:
  max_attempts: 2
  strategy: "refine_prompt_and_retry"
  escalation_on_exhausted: true

dataset_ref: "evaluations/tech-arch-dataset.jsonl"
