checkpoint_id: "task-decomposition-v1"
version: "1.0.0"
description: "任务拆分场景的端到端质量门禁"
scope: "scenarios/task-decomposition"
type: "hybrid"

evaluation_refs:
  - "evaluations/quality-rubric.yaml"

metrics:
  - name: "actionability"
    ref: "quality-rubric.dimensions.actionability"
    weight: 0.30
  - name: "completeness"
    ref: "quality-rubric.dimensions.completeness"
    weight: 0.25
  - name: "correctness"
    ref: "quality-rubric.dimensions.correctness"
    weight: 0.20
  - name: "consistency"
    ref: "quality-rubric.dimensions.consistency"
    weight: 0.15
  - name: "safety"
    ref: "quality-rubric.dimensions.safety"
    weight: 0.10

threshold:
  overall: 4.0
  per_metric_min:
    actionability: 4
    completeness: 3
  mandatory:
    - "safety"

automated_checks:
  - name: "schema_compliance"
    type: "json_schema"
    target: "output"
    schema_ref: "skills/schema-validator.yaml#task_plan_schema"
    action_on_fail: "fail_immediately"

  - name: "no_circular_dependency"
    type: "custom_script"
    target: "output"
    script_ref: "scripts/check_circular_deps.py"
    action_on_fail: "fail_immediately"

  - name: "task_granularity_check"
    type: "custom_script"
    target: "output"
    script_ref: "scripts/check_task_granularity.py"
    action_on_fail: "warn"

human_review:
  sampling_rate: 0.10
  trigger_conditions:
    - "overall_score between 3.0 and 4.0"
    - "critical_path contains high risk tasks"

retry_policy:
  max_attempts: 2
  strategy: "refine_prompt_and_retry"
  escalation_on_exhausted: true

dataset_ref: "evaluations/task-decomposition-dataset.jsonl"
