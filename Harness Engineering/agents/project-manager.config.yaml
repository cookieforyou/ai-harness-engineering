agent_id: "project-manager"
version: "1.0.0"
description: "项目经理 Agent，负责任务拆分、依赖分析与迭代规划。"

model:
  provider: "openai"
  name: "gpt-4o"
  temperature: 0.2
  max_tokens: 4096
  top_p: 0.95

runtime:
  max_iterations: 8
  timeout_seconds: 240
  retry_policy:
    max_retries: 3
    backoff: "exponential"
    initial_delay_seconds: 2

memory:
  type: "session"
  max_context_turns: 16

tools:
  - ref: "skills/task-dependency-graph.yaml"
    required: true
  - ref: "skills/schema-validator.yaml"
    required: true

observability:
  log_level: "INFO"
  trace_enabled: true
  metrics:
    - "latency_ms"
    - "token_usage"
    - "tool_call_count"
    - "human_escalation_count"

safety:
  instruction_refs:
    - "instructions/safety/data-privacy.md"
